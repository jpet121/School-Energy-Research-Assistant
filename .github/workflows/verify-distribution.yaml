name: Verify distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - run: docker build --tag retrofit-evidence:0.2.0 .
      - run: |
          bash deploy/start-local.sh
          python deploy/verify-install.py http://127.0.0.1:8765
      - if: failure()
        run: docker logs --tail 50 retrofit-evidence-desktop
